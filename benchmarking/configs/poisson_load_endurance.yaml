# Endurance Test Poisson Load Configuration
# Simulates realistic production load over 12+ hours

# Test configuration
test_duration_hours: 12.0
results_dir: "./data/results/llmperf/poisson_load_endurance"

# User arrival pattern - Moderate, sustained load
user_count:
  type: "poisson"
  lambda_users: 8.0  # Average 8 concurrent users
  min_users: 2
  max_users: 20
  resample_interval_seconds: 90  # Slower resampling for stability

# Per-user request rate - Moderate QPS
user_qps:
  type: "poisson"
  lambda_qps: 3.0  # Average 3 QPS per user (~24 total QPS)
  min_qps: 1.0
  max_qps: 8.0
  resample_interval_seconds: 45

# User session duration - Longer sessions
session_duration:
  type: "exponential"
  mean_duration_seconds: 600  # Average 10 minute sessions
  min_duration_seconds: 120
  max_duration_seconds: 1800  # Max 30 minutes

# Request configuration
request:
  num_input_tokens: 1500
  num_output_tokens: 750
  multimodal_image_size: "na"

  models:
    # - "DeepSeek-V3.1"
    - "MiniMax-M2.5"

  input_token_variation: 0.25  # ±25% variation
  output_token_variation: 0.25

# API configuration
api:
  llm_api: "sncloud"
  timeout: 600
  max_retries: 3

# Monitoring - Optimized for long duration
monitoring:
  checkpoint_interval_seconds: 300  # Checkpoint every 5 minutes
  checkpoint_interval_requests: 1000
  state_log_interval_seconds: 60  # Log state every minute
  enable_resume: true

# Load pattern variation - Simulate daily cycles
time_varying_pattern:
  enabled: true
  # Pattern: ramp up from 50% to 150% over 4 hours, then cycle
  patterns:
    - name: "morning_ramp_up"
      start_hour: 0.0
      end_hour: 2.0
      lambda_multiplier: 0.5  # 50% of base load

    - name: "peak_hours"
      start_hour: 2.0
      end_hour: 6.0
      lambda_multiplier: 1.5  # 150% of base load

    - name: "normal_hours"
      start_hour: 6.0
      end_hour: 10.0
      lambda_multiplier: 1.0  # 100% of base load

    - name: "evening_decline"
      start_hour: 10.0
      end_hour: 12.0
      lambda_multiplier: 0.7  # 70% of base load

# Load spike injection - Test occasional bursts
load_spikes:
  enabled: true
  spikes:
    # Morning spike at 3 hours
    - time_offset_seconds: 10800
      spike_multiplier: 2.0
      duration_seconds: 600

    # Midday spike at 6 hours
    - time_offset_seconds: 21600
      spike_multiplier: 2.5
      duration_seconds: 900

    # Evening spike at 9 hours
    - time_offset_seconds: 32400
      spike_multiplier: 1.8
      duration_seconds: 600
