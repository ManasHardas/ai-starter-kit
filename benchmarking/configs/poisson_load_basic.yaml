# Basic Poisson Load Configuration
# Simulates light to moderate load with 3-5 concurrent users

# Test configuration
test_duration_hours: 1.0
results_dir: "./data/results/llmperf/poisson_load_basic"

# User arrival pattern (Poisson distribution)
user_count:
  type: "poisson"
  lambda_users: 4.0  # Average 4 concurrent users
  min_users: 1
  max_users: 8
  resample_interval_seconds: 60  # Resample every minute

# Per-user request rate (Poisson distribution)
user_qps:
  type: "poisson"
  lambda_qps: 2.0  # Average 2 QPS per user
  min_qps: 0.5
  max_qps: 5.0
  resample_interval_seconds: 30  # Resample every 30 seconds

# User session duration (Exponential distribution)
session_duration:
  type: "exponential"
  mean_duration_seconds: 300  # Average 5 minute sessions
  min_duration_seconds: 60
  max_duration_seconds: 900  # Max 15 minutes

# Request configuration
request:
  num_input_tokens: 1000
  num_output_tokens: 1000
  multimodal_image_size: "na"

  # Model selection (uniform random)
  models:
    # - "DeepSeek-V3.1"
    - "MiniMax-M2.5"
    # - "Meta-Llama-3.3-70B-Instruct"

  # Token count variation (optional)
  input_token_variation: 0.2  # ±20%
  output_token_variation: 0.2  # ±20%

# API configuration
api:
  llm_api: "sncloud"
  timeout: 600
  max_retries: 3

# Monitoring and checkpointing
monitoring:
  checkpoint_interval_seconds: 180  # Checkpoint every 3 minutes
  checkpoint_interval_requests: 500
  state_log_interval_seconds: 30  # Log state every 30 seconds
  enable_resume: true

# Load spike injection (optional)
load_spikes:
  enabled: false
  # Example: inject spike at 30 minutes into test
  # - time_offset_seconds: 1800
  #   spike_multiplier: 3.0
  #   duration_seconds: 300
