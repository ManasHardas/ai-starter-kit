# Quick Test Poisson Load Configuration
# Fast validation test - 5 minutes with minimal load

load_config:
  # Test duration
  test_duration_hours: 0.0833  # 5 minutes

  # Results directory
  results_dir: "./data/results/llmperf/poisson_load_quick_test"

  # Checkpointing
  checkpoint_interval_seconds: 30
  checkpoint_interval_requests: 50
  enable_resume: true

  # User arrival pattern (Poisson distribution)
  user_concurrency:
    lambda_users: 2.0  # Average 2 concurrent users
    distribution: "poisson"
    min_users: 1
    max_users: 4
    time_pattern:
      enabled: false

  # Per-user request rate (Poisson distribution)
  user_request_rate:
    lambda_qps: 1.0  # Average 1 QPS per user
    distribution: "poisson"
    min_qps: 0.5
    max_qps: 2.0

  # User session duration (Exponential distribution)
  user_session:
    duration_distribution: "exponential"
    mean_duration_seconds: 60  # Average 1 minute sessions
    min_duration_seconds: 20
    max_duration_seconds: 180  # Max 3 minutes

  # Resampling intervals
  resampling:
    user_count_interval_seconds: 30  # Fast resampling to see variability
    user_qps_interval_seconds: 15  # Fast resampling

  # Request configuration
  request_params:
    num_input_tokens:
      distribution: "normal"
      mean: 500
      std: 50  # ±10% variation
      min: 400
      max: 600

    num_output_tokens:
      distribution: "normal"
      mean: 250
      std: 25  # ±10% variation
      min: 200
      max: 300

    multimodal_image_size: "na"

    model_distribution:
      - model: "MiniMax-M2.5"
        probability: 1.0

  # Load spikes - Disabled for quick test
  load_spikes:
    enabled: false

  # System limits
  limits:
    max_concurrent_users: 10
    max_total_qps: 100

  # LLM API settings
  llm_api: "sncloud"
  timeout: 300
  use_debugging_mode: false

  # Monitoring
  state_log_interval_seconds: 10  # Log frequently for testing
